services:
  api:
    build: ???            # where is your Dockerfile, relative to this file?
    ports:
      - "???:???"         # HOST:CONTAINER, same mapping as your docker run -p
    env_file:
      - ???               # which file holds your config?
    depends_on:
      postgres:
        condition: ???    # not just "started". Which condition waits for the healthcheck?

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "???:5432"        # see "Your daily workflow" below
    volumes:
      - ???:/var/lib/postgresql/data   # name for the volume : where Postgres stores data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ???:                    # declare the same volume name here